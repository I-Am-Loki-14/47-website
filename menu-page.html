    <script>
        const MenuSliders = document.querySelectorAll('.menu-container .menu-container-card')
        let indexx = 0;

        function nextt() {
            indexx = (indexx + 1) % MenuSliders.length
            MenuSliders.forEach(menuslide => menuslide.classList.remove('active-first'))
            MenuSliders[indexx].classList.add('active-first')
        }

        function prevv() {
            indexx = (indexx - 1 + MenuSliders.length) % MenuSliders.length
            MenuSliders.forEach(menuslide => menuslide.classList.remove('active-first'))
            MenuSliders[indexx].classList.add('active-first')
        }
        // setInterval(nextt, 4000)
